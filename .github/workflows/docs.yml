name: Build & Deploy Docs
on:
  push:
    branches: [ main, master ]
    paths:
      - "docs/**"
      - "src/**"
      - "bin/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - "tools/**"
      - "tests/test_docs_playwright.py"
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          pip install -e ".[docs]" linkchecker
      - run: python -m playwright install --with-deps chromium
      - run: python tools/site_prepare.py
      - run: mkdocs build --strict
      - name: Browser smoke tests
        run: |
          python -m http.server 8000 --directory site > /tmp/spectralbridge-docs-http.log 2>&1 &
          echo $! > /tmp/spectralbridge-docs-http.pid
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Docs server did not become ready.")
          PY
          SPECTRALBRIDGE_DOCS_SITE=http://127.0.0.1:8000 pytest -q tests/test_docs_playwright.py
      - name: Stop docs server
        if: always()
        run: |
          if [ -f /tmp/spectralbridge-docs-http.pid ]; then
            kill "$(cat /tmp/spectralbridge-docs-http.pid)" || true
          fi
      - name: Link check (best-effort)
        continue-on-error: true
        run: linkchecker site/index.html || true
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
