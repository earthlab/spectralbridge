name: CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/spectralbridge/**"
      - "src/cross_sensor_cal/**"
      - "tests/**"
      - "examples/**"
      - "provenance/sensor-pft-transfer/**"
      - "provenance/publication-figures/**"
      - "provenance/real-landsat-validation/**"
      - "output/pdf/publication_figures/**"
      - "scripts/generate_scientific_docs.py"
      - "pytest.ini"
      - "scripts/generate_ai_transparency.py"
      - "scripts/generate_api_reference.py"
      - "scripts/generate_validation_docs.py"
      - "scripts/run_validation_campaign.py"
      - "scripts/check_installed_artifact.py"
      - "scripts/check_release_metadata.py"
      - "PROMPT_LOG.md"
      - "provenance/prompts/**"
      - "docs/api/**"
      - "docs/ai-transparency.*"
      - "docs/images/ai-transparency/**"
      - "docs/validation/**"
      - "validation/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches: [ main ]
    paths:
      - "src/spectralbridge/**"
      - "src/cross_sensor_cal/**"
      - "tests/**"
      - "examples/**"
      - "provenance/sensor-pft-transfer/**"
      - "provenance/publication-figures/**"
      - "provenance/real-landsat-validation/**"
      - "output/pdf/publication_figures/**"
      - "scripts/generate_scientific_docs.py"
      - "pytest.ini"
      - "scripts/generate_ai_transparency.py"
      - "scripts/generate_api_reference.py"
      - "scripts/generate_validation_docs.py"
      - "scripts/run_validation_campaign.py"
      - "scripts/check_installed_artifact.py"
      - "scripts/check_release_metadata.py"
      - "PROMPT_LOG.md"
      - "provenance/prompts/**"
      - "docs/api/**"
      - "docs/ai-transparency.*"
      - "docs/images/ai-transparency/**"
      - "docs/validation/**"
      - "validation/**"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  lite:
    name: CI / lite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint and lite dependencies
        run: |
          python -m pip install -U pip
          pip install -e .[tests] ruff

      - name: Import package version
        run: python -c "import spectralbridge; print(spectralbridge.__version__)"

      - name: Lint and smoke tests
        env:
          CSCAL_TEST_MODE: lite
        run: |
          ruff check src tests scripts/generate_ai_transparency.py \
            scripts/generate_api_reference.py scripts/check_api_reference.py scripts/generate_validation_docs.py scripts/run_validation_campaign.py \
            scripts/check_installed_artifact.py scripts/check_release_metadata.py
          pytest -q -m "lite"

      - name: Verify AI transparency and API reference artifacts
        run: |
          python scripts/generate_ai_transparency.py --check
          python scripts/generate_api_reference.py --check

      - name: Verify validation evidence pages
        run: python scripts/generate_validation_docs.py --check

  unit:
    name: CI / unit / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    needs: lite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          pip install -e .[tests,analytics]

      - name: Import package version
        run: python -c "import spectralbridge; print(spectralbridge.__version__)"

      - name: Run targeted regression slices
        run: |
          pytest -q tests/test_drone_pipeline.py
          pytest -q tests/test_qa

      - name: Run full test suite
        env:
          CSCAL_TEST_MODE: unit
        run: |
          pytest -q -m "not full and not network and not playwright" --cov=spectralbridge --cov-branch \
            --cov-report=term --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ matrix.python-version }}
          if-no-files-found: warn
          path: |
            coverage.xml
            coverage.json

  unit-gate:
    name: CI / unit
    runs-on: ubuntu-latest
    needs: unit
    if: always()
    steps:
      - name: Require every supported Python unit job
        run: test "${{ needs.unit.result }}" = success
