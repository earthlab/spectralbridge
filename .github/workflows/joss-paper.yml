name: JOSS paper

on:
  push:
    paths:
      - 'drafts/joss/**'
      - 'scripts/check_joss_submission.py'
      - 'tests/test_joss_submission.py'
      - '.github/workflows/joss-paper.yml'
  pull_request:
    paths:
      - 'drafts/joss/**'
      - 'scripts/check_joss_submission.py'
      - 'tests/test_joss_submission.py'
      - '.github/workflows/joss-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check paper source contracts
        run: |
          python -m pip install PyYAML pytest
          python scripts/check_joss_submission.py --output drafts/joss/submission-checks.json
          python -m pytest -q tests/test_joss_submission.py
      - name: Build with the official Open Journals renderer
        run: |
          docker run --rm --network none \
            --volume "$PWD/drafts/joss:/data" \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            openjournals/inara@sha256:a0414b8b72fd8923917ede614d340d98dc7aa3102aabc2e955e9c02a6100fd62 \
            -o pdf paper.md
      - name: Upload paper preview and source checks
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-preview
          path: |
            drafts/joss/paper.pdf
            drafts/joss/submission-checks.json
          if-no-files-found: error
