name: JOSS paper

on:
  push:
    paths:
      - 'paper/**'
      - 'scripts/check_joss_submission.py'
      - 'scripts/build_publication.sh'
      - 'scripts/record_publication_build.py'
      - 'tests/test_joss_submission.py'
      - '.github/workflows/joss-paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/check_joss_submission.py'
      - 'scripts/build_publication.sh'
      - 'scripts/record_publication_build.py'
      - 'tests/test_joss_submission.py'
      - '.github/workflows/joss-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check paper source contracts
        run: |
          python -m pip install PyYAML pytest
          python scripts/check_joss_submission.py --output paper/generated/submission-checks.json
          python -m pytest -q tests/test_joss_submission.py
      - name: Build with the official Open Journals renderer
        run: bash scripts/build_publication.sh paper
      - name: Upload paper preview and source checks
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-preview
          path: |
            paper/generated/paper.pdf
            paper/generated/submission-checks.json
            paper/generated/build-verification.json
          if-no-files-found: error
