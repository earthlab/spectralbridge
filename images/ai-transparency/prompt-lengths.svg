<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc">
<title id="title">Prompt length distribution</title>
<desc id="desc">Word-like tokens per logged prompt; pasted specifications and logs can increase counts.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="36" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172554">Prompt length distribution</text>
<text x="36" y="70" font-family="Arial, sans-serif" font-size="14" fill="#475569">Word-like tokens per logged prompt; pasted specifications and logs can increase counts.</text>
<text x="316" y="128" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">1–25 words</text>
<rect x="330" y="110" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="110" width="600.0" height="25" rx="4" fill="#2563eb"/>
<text x="939.0" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">90</text>
<text x="316" y="170" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">26–100 words</text>
<rect x="330" y="152" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="152" width="593.3" height="25" rx="4" fill="#0891b2"/>
<text x="932.3" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">89</text>
<text x="316" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">101–250 words</text>
<rect x="330" y="194" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="194" width="93.3" height="25" rx="4" fill="#059669"/>
<text x="432.3" y="212" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">14</text>
<text x="316" y="254" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">251–500 words</text>
<rect x="330" y="236" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="236" width="40.0" height="25" rx="4" fill="#65a30d"/>
<text x="379.0" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">6</text>
<text x="316" y="296" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">&gt;500 words</text>
<rect x="330" y="278" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="278" width="126.7" height="25" rx="4" fill="#ca8a04"/>
<text x="465.7" y="296" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">19</text>
</svg>
