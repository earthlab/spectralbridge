site_name: SpectralBridge
site_description: >-
  SpectralBridge translates reflectance across sensors and scales to place NEON
  AOP hyperspectral flightlines into analysis-ready products.
site_url: https://earthlab.github.io/spectralbridge
repo_url: https://github.com/earthlab/spectralbridge
edit_uri: edit/main/docs/

theme:
  name: material
  logo: asset/img/spectralbridge_favicon.png
  favicon: asset/img/spectralbridge_favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md

  - Learn:
      - Choose a vignette: vignettes/index.md
      - Runnable notebooks: vignettes/notebook-vignettes.md
      - Why cross-sensor calibration?: concepts/why-calibration.md
      - End-to-end workflows:
          - Run the full pipeline: vignettes/full-pipeline.md
          - Carry On My Wayward Son (resume a run): vignettes/carry-on-wayward-son.md
      - Module vignettes:
          - 1. Acquire NEON data: vignettes/data-acquisition.md
          - 2. Correct NEON reflectance: vignettes/neon-correction.md
          - 3. Harmonize target sensors: vignettes/sensor-harmonization.md
          - 4. Build analysis tables: vignettes/analysis-tables.md
          - 5. Review QA outputs: vignettes/qa-and-analysis.md
          - 6. Process drone imagery: vignettes/drone-processing.md
          - 7. Extract polygon spectra: vignettes/polygon-extraction.md
          - 8. Build a bulk cross-run analysis: vignettes/bulk-analysis.md
      - Run on cloud or HPC: tutorials/cloud-workflow.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md

  - Validation:
      - Evidence overview: validation/index.md
      - Real flightline walkthrough: validation/real-data-example.md
      - Stage QA test guide: validation/stage-qa-guide.md
      - Module evidence:
          - NEON HDF5 download: validation/neon_download.md
          - HDF5 to raw ENVI: validation/h5_to_envi.md
          - Topographic correction: validation/topographic_correction.md
          - BRDF correction: validation/brdf_correction.md
          - Sensor convolution: validation/sensor_convolution.md
          - Parquet and CSV: validation/parquet_csv.md
          - Save and restart behavior: validation/save_restart.md
          - QA plots and diagnostics: validation/qa_plots.md

  - Technical reference:
      - Reference map: reference/index.md
      - Pipeline contracts:
          - Stage order and restart behavior: pipeline/stages.md
          - Outputs and file structure: pipeline/outputs.md
          - Naming conventions: naming-conventions.md
      - Interfaces:
          - Command-line interface: usage/cli.md
          - Configuration: reference/configuration.md
          - Python API: api/index.md
      - Data and validation:
          - Working with Parquet: usage/parquet.md
          - JSON file catalog: reference/json-catalog.md
          - JSON schemas: reference/schemas.md
          - QA panels and metrics: pipeline/qa.md
          - Stage-by-stage scientific QA: pipeline/stage-qa.md
          - QA implementation map: reference/qa-code-map.md
          - Validation metrics: reference/validation.md
      - Algorithms and extension:
          - BRDF and topographic correction: brdf_topo_algorithm.md
          - Add a custom correction: reference/custom-correction-hook.md
          - Extending SpectralBridge: reference/extending.md
      - Runtime and internals:
          - Repository map: reference/repository-map.md
          - Environment: env.md
          - Package architecture: dev/architecture.md
          - Container and remote helpers: dev/container-workflows.md

  - Project:
      - Contributing: dev/contributing.md
      - Releasing: dev/releasing.md
      - Production validation record: dev/production-validation-record.md
      - Software citation: dev/software-citation.md
      - DOI and Zenodo status: dev/doi-zenodo.md
      - Publication readiness audit: dev/publication-readiness-audit-2026-08-14.md
      - AI transparency statement: ai-transparency.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_signature: true
            show_source: false
            merge_init_into_class: true
  - macros

extra_css:
  - stylesheets/spectralbridge.css

extra_javascript:
  - js/glightbox-init.js

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - md_in_html
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/earthlab/spectralbridge
  footer: |
    <div class="sb-footer">
      <div class="sb-footer__text">
        <p class="sb-footer__title">SpectralBridge</p>
        <p>Environmental Data Science Innovation and Impact Lab (ESIIL)</p>
        <p>University of Colorado Boulder</p>
        <p>Cooperative Institute for Research in Environmental Sciences (CIRES)</p>
        <p>Boulder, Colorado, USA</p>
        <p>Website: <a href="https://esiil.org">https://esiil.org</a></p>
        <p>Last updated: August 2026</p>
      </div>
      <div class="sb-footer__logos">
        <a href="https://cires.colorado.edu" aria-label="CIRES website">
          <img src="asset/img/CIRES%20logo%20black%20lettering%20transparent%20bkgrnd.png" alt="CIRES logo" loading="lazy">
        </a>
        <a href="https://esiil.org" aria-label="ESIIL website">
          <img src="asset/img/Final_ESIIL%20Wordmark%20Color_0.png" alt="ESIIL logo" loading="lazy">
        </a>
        <a href="https://www.nsf.gov" aria-label="National Science Foundation website">
          <img src="asset/img/NSF_Official_logo_High_Res_1200ppi.png" alt="National Science Foundation logo" loading="lazy">
        </a>
        <a href="https://bouldercolorado.gov" aria-label="City of Boulder website">
          <img src="asset/img/Boulder_shorty_left_2025.png" alt="City of Boulder logo" loading="lazy">
