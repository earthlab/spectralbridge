site_name: SpectralBridge
site_description: >-
  SpectralBridge provides separate NEON flightline, drone imagery, and bulk
  cross-run analysis workflows with traceable reflectance products and QA.
site_url: https://earthlab.github.io/spectralbridge
repo_url: https://github.com/earthlab/spectralbridge
edit_uri: edit/main/docs/

theme:
  name: material
  logo: asset/img/spectralbridge_favicon.png
  favicon: asset/img/spectralbridge_favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
- Home: index.md
- Understand:
  - Measurement basics: concepts/measurements.md
  - Correction and comparison: concepts/why-calibration.md
- Use:
  - First example and installation: getting-started.md
  - Choose a workflow: vignettes/index.md
  - NEON flightlines: vignettes/full-pipeline.md
  - Drone imagery: vignettes/drone-processing.md
  - Bulk analysis: vignettes/bulk-analysis.md
  - Spectral libraries: vignettes/spectral-library.md
  - Remote drone production: vignettes/drone-production.md
  - Runnable notebooks: vignettes/notebook-vignettes.md
  - Resume a run: vignettes/carry-on-wayward-son.md
  - Cloud and HPC: tutorials/cloud-workflow.md
  - Outputs: pipeline/outputs.md
  - CLI: usage/cli.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
- Validate:
  - Evidence hierarchy: validation/evidence-hierarchy.md
  - Evidence overview: validation/index.md
  - Stage QA: validation/stage-qa-guide.md
  - Real flightline walkthrough: validation/real-data-example.md
  - QA panels and metrics: pipeline/qa.md
  - Module contract evidence:
    - NEON acquisition: validation/neon_download.md
    - HDF5 to ENVI: validation/h5_to_envi.md
    - Topographic correction: validation/topographic_correction.md
    - BRDF correction: validation/brdf_correction.md
    - Spectral weighting: validation/sensor_convolution.md
    - Tables: validation/parquet_csv.md
    - Restart: validation/save_restart.md
    - QA plots: validation/qa_plots.md
  - Publication evidence:
    - Technical supplement: validation/supplement.md
    - Software/method provenance: hytools_manuscript_guidance.md
    - AI transparency: ai-transparency.md
- Reference:
  - Reference map: reference/index.md
  - Literature sources: reference/literature.md
  - Stage and filename contracts:
    - Stage order: pipeline/stages.md
    - Naming conventions: naming-conventions.md
    - Parquet: usage/parquet.md
  - Configuration and data:
    - Configuration: reference/configuration.md
    - JSON catalog: reference/json-catalog.md
    - Schemas: reference/schemas.md
    - Validation metrics: reference/validation.md
  - Algorithms and QA:
    - BRDF and topographic methods: brdf_topo_algorithm.md
    - Scientific QA by stage: pipeline/stage-qa.md
    - QA implementation map: reference/qa-code-map.md
  - Module workflows:
    - Acquire NEON: vignettes/data-acquisition.md
    - Correct NEON: vignettes/neon-correction.md
    - Target-band weighting: vignettes/sensor-harmonization.md
    - Analysis tables: vignettes/analysis-tables.md
    - QA review: vignettes/qa-and-analysis.md
    - Polygon extraction: vignettes/polygon-extraction.md
- Develop:
  - Repository map: reference/repository-map.md
  - Architecture: dev/architecture.md
  - API: api/index.md
  - Environment: env.md
  - Extending:
    - Custom correction hook: reference/custom-correction-hook.md
    - Extend sensors and algorithms: reference/extending.md
  - Tests and contribution: dev/contributing.md
  - CI ownership: dev/ci.md
  - Release gates: dev/releasing.md
  - Software citation: dev/software-citation.md
  - DOI status: dev/doi-zenodo.md
  - Production validation record: dev/production-validation-record.md
  - Containers and remote helpers: dev/container-workflows.md
  - Historical records: dev/history.md
  - Retained page catalog: page-catalog.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_signature: true
            show_source: false
            merge_init_into_class: true
  - macros

extra_css:
  - stylesheets/spectralbridge.css

extra_javascript:
  - js/glightbox-init.js

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - md_in_html
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/earthlab/spectralbridge
  footer: |
    <div class="sb-footer">
      <div class="sb-footer__text">
        <p class="sb-footer__title">SpectralBridge</p>
        <p>Environmental Data Science Innovation and Impact Lab (ESIIL)</p>
