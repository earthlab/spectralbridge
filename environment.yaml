# Legacy conda environment label retained for existing users; the current
# distribution is earthlab-spectralbridge and the import is spectralbridge.
name: cross-sensor-cal
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - pyarrow
  - h5py
  - requests
  - tqdm
  - matplotlib
  - rasterio=1.3.*
  - gdal=3.8.*
  - shapely=2.*
  - geopandas=0.14.*
  - pip:
      - spectral
      - ray[default]>=2.2
