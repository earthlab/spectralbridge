<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 895" role="img" aria-labelledby="title desc"><title id="title">Drone measurements to reviewed spectra</title><desc id="desc">Original photographs: Separate times, views and calibration records; Photogrammetry → orthomosaic: Reconstruct geometry; select or blend observations; Radiometric encoding: Distinguish numerical range from physical reflectance; Spatial validation → H5 conversion: Preserve grid, bands, masks and ancillary provenance; Eligible or explicitly omitted corrections: Review units, solar, terrain and angular support; Optional spectral translation: Compatible reviewed coefficients; native bands retained; Polygon extraction → spectral library: Check labels, spectra, masks and scientific domain</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#426779"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" text-anchor="middle"><text x="360" y="38" font-size="25" fill="#173e4f">Drone measurements to reviewed spectra</text><rect x="25" y="65" width="670" height="86" rx="10" fill="#e4eef2" stroke="#426779"/><text x="360" y="96" font-size="23" fill="#173e4f">Original photographs</text><text x="360" y="126" font-size="19" fill="#263c45">Separate times, views and calibration records</text><path d="M360,152 V173" stroke="#426779" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="180" width="670" height="86" rx="10" fill="#edf2e5" stroke="#426779"/><text x="360" y="211" font-size="23" fill="#173e4f">Photogrammetry → orthomosaic</text><text x="360" y="241" font-size="19" fill="#263c45">Reconstruct geometry; select or blend observations</text><path d="M360,267 V288" stroke="#426779" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="295" width="670" height="86" rx="10" fill="#e4eef2" stroke="#426779"/><text x="360" y="326" font-size="23" fill="#173e4f">Radiometric encoding</text><text x="360" y="356" font-size="19" fill="#263c45">Distinguish numerical range from physical reflectance</text><path d="M360,382 V403" stroke="#426779" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="410" width="670" height="86" rx="10" fill="#edf2e5" stroke="#426779"/><text x="360" y="441" font-size="23" fill="#173e4f">Spatial validation → H5 conversion</text><text x="360" y="471" font-size="19" fill="#263c45">Preserve grid, bands, masks and ancillary provenance</text><path d="M360,497 V518" stroke="#426779" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="525" width="670" height="86" rx="10" fill="#e4eef2" stroke="#426779"/><text x="360" y="556" font-size="23" fill="#173e4f">Eligible or explicitly omitted corrections</text><text x="360" y="586" font-size="19" fill="#263c45">Review units, solar, terrain and angular support</text><path d="M360,612 V633" stroke="#426779" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="640" width="670" height="86" rx="10" fill="#edf2e5" stroke="#426779"/><text x="360" y="671" font-size="23" fill="#173e4f">Optional spectral translation</text><text x="360" y="701" font-size="19" fill="#263c45">Compatible reviewed coefficients; native bands retained</text><path d="M360,727 V748" stroke="#426779" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="755" width="670" height="86" rx="10" fill="#e4eef2" stroke="#426779"/><text x="360" y="786" font-size="23" fill="#173e4f">Polygon extraction → spectral library</text><text x="360" y="816" font-size="19" fill="#263c45">Check labels, spectra, masks and scientific domain</text></g></svg>
