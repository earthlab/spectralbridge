<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 343" role="img" aria-labelledby="title desc">
<title id="title">Primary prompt intents</title>
<desc id="desc">One deterministic keyword-based primary intent is assigned to each logged prompt.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="36" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172554">Primary prompt intents</text>
<text x="36" y="70" font-family="Arial, sans-serif" font-size="14" fill="#475569">One deterministic keyword-based primary intent is assigned to each logged prompt.</text>
<text x="316" y="128" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">Implementation or modification</text>
<rect x="330" y="110" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="110" width="600.0" height="25" rx="4" fill="#2563eb"/>
<text x="939.0" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">89</text>
<text x="316" y="170" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">Other or mixed</text>
<rect x="330" y="152" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="152" width="357.3" height="25" rx="4" fill="#0891b2"/>
<text x="696.3" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">53</text>
<text x="316" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">Execution or verification</text>
<rect x="330" y="194" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="194" width="316.9" height="25" rx="4" fill="#059669"/>
<text x="655.9" y="212" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">47</text>
<text x="316" y="254" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#334155">Audit or investigation</text>
<rect x="330" y="236" width="600" height="25" rx="4" fill="#e2e8f0"/>
<rect x="330" y="236" width="168.5" height="25" rx="4" fill="#65a30d"/>
<text x="507.5" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">25</text>
